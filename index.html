<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2c200">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Snap Cards">
  <title>Snap Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app"></main>
  <div class="toast" id="toast" role="status"></div>

  <input type="file" id="cam" accept="image/*" capture="environment" hidden>
  <input type="file" id="lib" accept="image/*" multiple hidden>
  <input type="file" id="doc" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="cards.js"></script>
  <script src="docx.js"></script>
  <script src="app.js"></script>
</body>
</html>
